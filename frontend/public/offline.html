<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b7a5a" />
    <meta name="robots" content="noindex" />
    <title>You are offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #faf9f7; color: #1c1917; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 340px; }
      .mark { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px; background: #edfaf5; display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.55; color: #57524d; margin: 0 0 24px; }
      button { height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #0b7a5a; color: #fff; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0b7a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.7"/><path d="M19 12.9a10 10 0 0 0-2-1.5"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M22 8.8a15 15 0 0 0-11.3-3.9"/><path d="m2 2 20 20"/></svg>
      </div>
      <h1>You are offline</h1>
      <p>We could not reach the shop. Check your connection and try again. Your cart is saved.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
