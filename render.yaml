services:
  - type: web
    name: shophub-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/settings/public
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
